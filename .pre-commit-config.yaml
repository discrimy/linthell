repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff format
        language: system
        entry: poetry run ruff check
        types: [python]
      
      - id: ruff-format
        name: ruff format
        language: system
        entry: poetry run ruff format --check
        types: [python]

      - id: mypy
        name: mypy
        language: system
        entry: poetry run mypy
        types: [python]
